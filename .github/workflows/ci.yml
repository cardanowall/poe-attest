name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: typecheck, test, dist freshness
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      # Rebuilds the bundle into a temp dir and byte-compares it against the
      # committed dist/. A source change without a rebuilt dist fails here.
      - name: Verify committed dist/ is fresh
        run: npm run check:dist

  zizmor:
    name: zizmor (workflow static analysis)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Static analysis of the workflow files themselves (template injection,
      # excessive permissions, credential persistence, unpinned uses). Emits
      # inline annotations; the SARIF/code-scanning upload is disabled so no
      # security-events permission is needed.
      - uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
        with:
          version: '1.26.1'
          persona: regular
          advanced-security: false
          annotations: true
